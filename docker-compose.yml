version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: numosint_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-numosint}
      POSTGRES_USER: ${POSTGRES_USER:-numosint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-numosint_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - numosint_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numosint} -d ${POSTGRES_DB:-numosint}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: numosint_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - numosint_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: numosint_backend
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5001}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://frontend:3001
      - MAIGRET_SERVICE_URL=${MAIGRET_SERVICE_URL}
      - BUSTER_SERVICE_URL=${BUSTER_SERVICE_URL}
      - MOSINT_SERVICE_URL=${MOSINT_SERVICE_URL}
      - PHONEINFOGA_SERVICE_URL=${PHONEINFOGA_SERVICE_URL}
      - ASN_SERVICE_URL=${ASN_SERVICE_URL}
      - WAU_SERVICE_URL=${WAU_SERVICE_URL}
      - WAYBULK_SERVICE_URL=${WAYBULK_SERVICE_URL}
      - PDL_API_KEY=${PDL_API_KEY}
      - SPIDERFOOT_SERVICE_URL=${SPIDERFOOT_SERVICE_URL}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Clés API pour Mosint
      - BREACH_DIRECTORY_API_KEY=${BREACH_DIRECTORY_API_KEY}
      - EMAILREP_API_KEY=${EMAILREP_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - INTELX_API_KEY=${INTELX_API_KEY}
      - HAVEIBEENPWNED_API_KEY=${HAVEIBEENPWNED_API_KEY}
      # Clés API pour SpiderFoot
      - SPIDERFOOT_GOOGLE_API_KEY=${SPIDERFOOT_GOOGLE_API_KEY}
      - SPIDERFOOT_GOOGLE_CSE_ID=${SPIDERFOOT_GOOGLE_CSE_ID}
      - SPIDERFOOT_SHODAN_API_KEY=${SPIDERFOOT_SHODAN_API_KEY}
      - SPIDERFOOT_VIRUSTOTAL_API_KEY=${SPIDERFOOT_VIRUSTOTAL_API_KEY}
      # Configuration JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    volumes:
      - .:/app
      - /app/node_modules
      - logs_data:/app/logs
      - results_data:/app/results
      - reports_data:/app/reports
    networks:
      - numosint_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      maigret-service:
        condition: service_started
      buster-service:
        condition: service_started
      mosint-service:
        condition: service_started
      phoneinfoga-service:
        condition: service_started
      asn-service:
        condition: service_started
      spiderfoot-service:
        condition: service_started
      wau-service:
        condition: service_started
      waybulk-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5001}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  maigret-service:
    build:
      context: ./tools/maigret
      dockerfile: Dockerfile
    container_name: numosint_maigret_service
    volumes:
      - maigret_data:/app/data
    networks:
      - numosint_network
    restart: unless-stopped

  buster-service:
    build:
      context: ./tools/buster
      dockerfile: Dockerfile
    container_name: numosint_buster_service
    networks:
      - numosint_network
    restart: unless-stopped

  mosint-service:
    build:
      context: ./tools/mosint
      dockerfile: Dockerfile
    container_name: numosint_mosint_service
    environment:
      - BREACH_DIRECTORY_API_KEY=${BREACH_DIRECTORY_API_KEY}
      - EMAILREP_API_KEY=${EMAILREP_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - INTELX_API_KEY=${INTELX_API_KEY}
      - HAVEIBEENPWNED_API_KEY=${HAVEIBEENPWNED_API_KEY}
    networks:
      - numosint_network
    restart: unless-stopped

  phoneinfoga-service:
    build:
      context: ./tools/phoneinfoga
      dockerfile: Dockerfile
    container_name: numosint_phoneinfoga_service
    networks:
      - numosint_network
    restart: unless-stopped


  asn-service:
    build:
      context: ./tools/asn
      dockerfile: Dockerfile
    container_name: numosint_asn_service
    networks:
      - numosint_network
    restart: unless-stopped

  spiderfoot-service:
    build:
      context: ./tools/spiderfoot
      dockerfile: Dockerfile
    container_name: numosint_spiderfoot_service
    environment:
      - SPIDERFOOT_GOOGLE_API_KEY=${SPIDERFOOT_GOOGLE_API_KEY}
      - SPIDERFOOT_GOOGLE_CSE_ID=${SPIDERFOOT_GOOGLE_CSE_ID}
      - SPIDERFOOT_SHODAN_API_KEY=${SPIDERFOOT_SHODAN_API_KEY}
      - SPIDERFOOT_VIRUSTOTAL_API_KEY=${SPIDERFOOT_VIRUSTOTAL_API_KEY}
      - HAVEIBEENPWNED_API_KEY=${HAVEIBEENPWNED_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
    volumes:
      - ./tools/spiderfoot/config/sfconfig.py:/home/spiderfoot/sfconfig.py:ro
    networks:
      - numosint_network
    restart: unless-stopped

  wau-service:
    build:
      context: ./tools/wau
      dockerfile: Dockerfile
    container_name: numosint_wau_service
    networks:
      - numosint_network
    restart: unless-stopped

  waybulk-service:
    build:
      context: ./tools/waybulk
      dockerfile: Dockerfile
    container_name: numosint_waybulk_service
    networks:
      - numosint_network
    restart: unless-stopped

  frontend:
    image: numosint-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: numosint_frontend
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8081
      - INTERNAL_API_URL=http://backend:5001
      - NEXTAUTH_URL=http://localhost:8081
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - numosint_network
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: numosint_nginx
    ports:
      - "8081:80"
      - "8444:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - numosint_network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
  
  # e2e-tester:
  #   build:
  #     context: .
  #     dockerfile: tests/Dockerfile.e2e
  #   container_name: numosint_e2e_tester
  #   environment:
  #     - PUPPETEER_SKIP_DOWNLOAD=true
  #   depends_on:
  #     - nginx
  #     - backend
  #     - frontend
  #   networks:
  #     - numosint_network
  #   volumes:
  #     - .:/app
  #   command: ["npm", "run", "test:e2e"]

  qdrant:
    image: qdrant/qdrant
    container_name: numosint_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - numosint_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  maigret_data:
    driver: local
  logs_data:
    driver: local
  results_data:
    driver: local
  reports_data:
    driver: local
  qdrant_storage:
    driver: local

networks:
  numosint_network:
    driver: bridge