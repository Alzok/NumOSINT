# Version simplifiée fonctionnelle de docker-compose

version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: numosint_postgres
    environment:
      POSTGRES_DB: numosint
      POSTGRES_USER: numosint
      POSTGRES_PASSWORD: numosint_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - numosint_network
    restart: unless-stopped

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: numosint_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - numosint_network
    restart: unless-stopped

  # Backend API avec nouvelle architecture
  backend:
    build: .
    container_name: numosint_backend
    environment:
      - DATABASE_URL=postgresql://numosint:numosint_password@postgres:5432/numosint
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - numosint_network
    restart: unless-stopped

  # Frontend Next.js
  frontend:
    build: ./frontend
    container_name: numosint_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - numosint_network
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: numosint_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - numosint_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  numosint_network:
    driver: bridge