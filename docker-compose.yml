# Version simplifiée fonctionnelle de docker-compose

version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: numosint_postgres
    environment:
      POSTGRES_DB: numosint
      POSTGRES_USER: numosint
      POSTGRES_PASSWORD: numosint_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - numosint_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numosint -d numosint"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: numosint_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - numosint_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API avec nouvelle architecture
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: numosint_backend
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=postgresql://numosint:numosint_password@postgres:5432/numosint
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://frontend:3001
    ports:
      - "5001:5001"
    volumes:
      - ./logs:/app/logs
      - ./results:/app/results
    networks:
      - numosint_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Next.js
  frontend:
    image: numosint-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: numosint_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - numosint_network
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: numosint_nginx
    ports:
      - "8081:80"
      - "8444:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - numosint_network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  numosint_network:
    driver: bridge