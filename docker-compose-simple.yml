# Version simplifiée fonctionnelle de docker-compose

services:
  # Service Redis pour la queue des tâches
  redis:
    image: redis:7-alpine
    container_name: turbolehe-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Service API Backend
  backend:
    build: .
    container_name: turbolehe-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
    volumes:
      - ./results:/app/results
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./data.json:/app/data.json
    depends_on:
      - redis
    restart: unless-stopped
    command: python app.py

  # Service Worker Celery pour les tâches asynchrones
  worker:
    build: .
    container_name: turbolehe-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
    volumes:
      - ./results:/app/results
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info

  # Service Frontend Legacy (interface qui fonctionne)
  frontend-legacy:
    image: nginx:alpine
    container_name: turbolehe-frontend-legacy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./data.json:/usr/share/nginx/html/data.json:ro
    depends_on:
      - backend
    restart: unless-stopped 